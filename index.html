<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoké au vivo</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0}main{max-width:650px;margin:auto;padding:24px 16px 50px}h1{text-align:center;margin:5px 0}.sub{text-align:center;color:#aaa;margin:6px 0 20px}input{width:100%;box-sizing:border-box;padding:14px;border:0;border-radius:12px;font-size:16px;margin:8px 0;background:#222;color:#fff}.song{display:flex;flex-direction:column;text-align:left;width:100%;background:#1f1f1f;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;margin:7px 0;cursor:pointer}.song span{color:#aaa;margin-top:4px}.hidden{display:none}.card{background:#1d1d1d;padding:18px;border-radius:16px;margin-top:18px}.send{background:#25D366;color:#111;font-weight:bold;border:0;border-radius:12px;padding:14px;width:100%;font-size:16px;margin-top:14px}.back{background:none;color:#aaa;border:0;padding:8px 0}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#292929;color:#ccc;font-size:13px;margin:2px}.admin{margin-top:28px;border-top:1px solid #333;padding-top:18px}.order{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#222;padding:10px;border-radius:10px;margin:6px 0}.order small{color:#aaa}.done{background:#444;color:#fff;border:0;border-radius:8px;padding:7px}.empty{color:#888;text-align:center;padding:12px}</style></head><body><main><h1>🎤 Karaoké au vivo</h1><div class="sub">Choisissez une chanson et envoyez votre demande</div><section id="list"><input id="search" placeholder="🔎 Rechercher une chanson ou un artiste..." oninput="filter()"><div id="songs"></div></section><section id="form" class="card hidden"><button class="back" onclick="back()">← Retour</button><h2 id="selected"></h2><label>Votre prénom</label><input id="name" placeholder="Ex. Marie"><label>Votre table</label><input id="table" placeholder="Ex. 12"><button class="send" onclick="send()">🎤 Envoyer sur WhatsApp</button></section><section class="admin"><span class="tag">Mode artiste</span><input id="adminSong" placeholder="Ajouter un morceau à la file (nom)" onkeydown="if(event.key==='Enter')addManual()"><div id="queue"></div><div class="sub">File centrale — mise à jour automatiquement.</div></section><iframe id="sende<script>
const API='https://script.google.com/macros/s/AKfycbxPEQA5WFhaqwX7c7dRUPjxIOZdwczj3Z4qOk6gBb974jPhJScUW7pVA0X-sBXbvIZu/exec';
const SHEET='1JIJdknwFh5w7pZFJPpfbjh5nvs5h4DFCa3g7Tq-CD3A';
const songs=["Sozinho — Caetano Veloso","Lanterna Dos Afogados — Os Paralamas do Sucesso","Por Onde Andei — Nando Reis","Primavera — Tim Maia","Eu Te Devoro — Djavan","Final Feliz — Jorge Vercillo","Aonde Quer Que Eu Vá — Os Paralamas do Sucesso","Faz Parte do Meu Show — Cazuza","Como Eu Quero — Kid Abelha","Lenha — Zeca Baleiro","Só Hoje — Jota Quest","Dias Melhores — Jota Quest","Segredos — Frejat","Catedral — Zélia Duncan","Chão de Giz — Zé Ramalho","All Star — Nando Reis","Homem Não Chora — Frejat","Já Sei Namorar — Tribalistas","Luz Dos Olhos — Nando Reis","Tudo Que Vai — Capital Inicial","Natasha — Capital Inicial","O Tempo Não Para — Cazuza","Tente Outra Vez — Raul Seixas","À Sua Maneira — Capital Inicial","Tanto (I Want You) — Skank","Pescador de Ilusões — O Rappa","O Segundo Sol — Cássia Eller","Tempo Perdido — Legião Urbana","Pais e Filhos — Legião Urbana","Malandragem — Cássia Eller","Burguesinha — Seu Jorge","Hoje a Noite Não Tem Luar — Legião Urbana","Eu Sei — Papas da Língua","Codinome Beija-Flor — Cazuza","Um Dia de Domingo — Tim Maia","Wish You Were Here — Pink Floyd","Losing My Religion — R.E.M.","É Preciso Saber Viver — Titãs","Por Enquanto — Cássia Eller","Pra Você Guardei o Amor — Nando Reis","Anunciação — Alceu Valença","Black — Pearl Jam","Kiss Me — Sixpence None The Richer","Linger — The Cranberries","Lucky — Jason Mraz","Bubbly — Colbie Caillat","Si Antes Te Hubiera Conocido — KAROL G","Billie Jean — Michael Jackson","Iris — Goo Goo Dolls","Wherever You Will Go — The Calling","Ironic — Alanis Morissette","Boa Sorte — Vanessa da Mata","What's Up — 4 Non Blondes","Fogo — Capital Inicial","Behind Blue Eyes — Limp Bizkit","Metamorfose Ambulante — Raul Seixas","Times Like These — Foo Fighters","Sound Of Silence — Disturbed","I'm Yours — Jason Mraz"];
let selected='';
let isArtist=new URLSearchParams(location.search).get('artista')==='1';
function render(){document.getElementById('songs').innerHTML=songs.map((s,i)=>`<button class="song" onclick="choose(${i})">🎵 ${s}</button>`).join('');const a=document.querySelector('.admin');if(isArtist){a.style.display='block';loadQueue();}else a.style.display='none';}
function choose(i){selected=songs[i];document.getElementById('selected').textContent=selected;document.getElementById('list').classList.add('hidden');document.getElementById('form').classList.remove('hidden');}
function back(){document.getElementById('form').classList.add('hidden');document.getElementById('list').classList.remove('hidden');}
function filter(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.song').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none');}
function post(data){fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).catch(()=>{});}
function send(){let n=document.getElementById('name').value.trim()||'Client';let t=document.getElementById('table').value.trim();let parts=selected.split(' — ');post({action:'add',song:parts.shift(),artist:parts.join(' — '),name:n,table:t});let msg='🎤 NOUVELLE DEMANDE\n\n🎵 '+selected+'\n👤 Client : '+n+(t?'\n🍽️ Table : '+t:'');window.open('https://wa.me/33759377927?text='+encodeURIComponent(msg),'_blank');document.getElementById('form').classList.add('hidden');document.getElementById('list').classList.remove('hidden');alert('Merci ! Votre demande a été envoyée.');}
function loadQueue(){let cb='queueCallback_'+Date.now();window[cb]=function(data){renderQueue(data);delete window[cb];};let sc=document.createElement('script');sc.src='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&tq='+encodeURIComponent("select * where F <> 'Concluída' order by G asc");sc.onerror=()=>{document.getElementById('queue').innerHTML='<div class="empty">Impossible de charger la file.</div>';};document.body.appendChild(sc);}
function renderQueue(data){let rows=(data.table&&data.table.rows)||[];let q=rows.map(r=>r.c.map(x=>x?x.v:'')).filter(r=>r[5]!=='Concluída');document.getElementById('queue').innerHTML=q.length?q.map(r=>{let status=r[5]||'Pendente';let row=r[0]||'';return `<div class="order"><div><b>🎵 ${r[1]||''}${r[2]?' — '+r[2]:''}</b><br><small>👤 ${r[3]||'Client'}${r[4]?' · 🍽️ '+r[4]:''}</small></div><div><span class="tag">${status}</span><br><button class="done" onclick="setStatus('${row}','Tocando')">🎤 Tocando</button> <button class="done" onclick="setStatus('${row}','Concluída')">✅ Concluída</button></div></div>`;}).join(''):'<div class="empty">Aucun morceau en attente.</div>';}
function setStatus(row,status){post({action:'status',row:Number(row),status:status});setTimeout(loadQueue,800);}
function addManual(){let v=document.getElementById('adminSong').value.trim();if(!v)return;let parts=v.split(' — ');post({action:'add',song:parts.shift(),artist:parts.join(' — '),name:'Artiste',table:''});document.getElementById('adminSong').value='';setTimeout(loadQueue,800);}
setInterval(()=>{if(isArtist)loadQueue();},5000);
render();
</script></body></html>
