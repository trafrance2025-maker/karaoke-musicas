<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoké au vivo</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0}main{max-width:650px;margin:auto;padding:24px 16px 50px}h1{text-align:center;margin:5px 0}.sub{text-align:center;color:#aaa;margin:6px 0 20px}input{width:100%;box-sizing:border-box;padding:14px;border:0;border-radius:12px;font-size:16px;margin:8px 0;background:#222;color:#fff}.song{display:flex;flex-direction:column;text-align:left;width:100%;background:#1f1f1f;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;margin:7px 0;cursor:pointer}.song span{color:#aaa;margin-top:4px}.hidden{display:none}.card{background:#1d1d1d;padding:18px;border-radius:16px;margin-top:18px}.send{background:#25D366;color:#111;font-weight:bold;border:0;border-radius:12px;padding:14px;width:100%;font-size:16px;margin-top:14px}.back{background:none;color:#aaa;border:0;padding:8px 0}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#292929;color:#ccc;font-size:13px;margin:2px}.admin{margin-top:28px;border-top:1px solid #333;padding-top:18px}.order{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#222;padding:10px;border-radius:10px;margin:6px 0}.order small{color:#aaa}.done{background:#444;color:#fff;border:0;border-radius:8px;padding:7px}.empty{color:#888;text-align:center;padding:12px}</style></head><body><main><h1>🎤 Karaoké au vivo</h1><div class="sub">Choisissez une chanson et envoyez votre demande</div><section id="list"><input id="search" placeholder="🔎 Rechercher une chanson ou un artiste..." oninput="filter()"><div id="songs"></div></section><section id="form" class="card hidden"><button class="back" onclick="back()">← Retour</button><h2 id="selected"></h2><label>Votre prénom</label><input id="name" placeholder="Ex. Marie"><label>Votre table</label><input id="table" placeholder="Ex. 12"><button class="send" onclick="send()">🎤 Envoyer sur WhatsApp</button></section><section class="admin"><span class="tag">Mode artiste</span><input id="adminSong" placeholder="Ajouter un morceau à la file (nom)" onkeydown="if(event.key==='Enter')addManual()"><div id="queue"></div><div class="sub">La file affichée ici est enregistrée sur cet appareil.</div></section></main><script>const songs=["Sozinho — Caetano Veloso","Lanterna Dos Afogados — Os Paralamas do Sucesso","Por Onde Andei — Nando Reis","Primavera — Tim Maia","Eu Te Devoro — Djavan","Final Feliz — Jorge Vercillo","Aonde Quer Que Eu Vá — Os Paralamas do Sucesso","Faz Parte do Meu Show — Cazuza","Como Eu Quero — Kid Abelha","Lenha — Zeca Baleiro","Só Hoje — Jota Quest","Dias Melhores — Jota Quest","Segredos — Frejat","Catedral — Zélia Duncan","Chão de Giz — Zé Ramalho","All Star — Nando Reis","Homem Não Chora — Frejat","Já Sei Namorar — Tribalistas","Luz Dos Olhos — Nando Reis","Tudo Que Vai — Capital Inicial","Natasha — Capital Inicial","O Tempo Não Para — Cazuza","Tente Outra Vez — Raul Seixas","À Sua Maneira — Capital Inicial","Tanto (I Want You) — Skank","Pescador de Ilusões — O Rappa","O Segundo Sol — Cássia Eller","Tempo Perdido — Legião Urbana","Pais e Filhos — Legião Urbana","Malandragem — Cássia Eller","Burguesinha — Seu Jorge","Hoje a Noite Não Tem Luar — Legião Urbana","Eu Sei — Papas da Língua","Codinome Beija-Flor — Cazuza","Um Dia de Domingo — Tim Maia","Wish You Were Here — Pink Floyd","Losing My Religion — R.E.M.","É Preciso Saber Viver — Titãs","Por Enquanto — Cássia Eller","Pra Você Guardei o Amor — Nando Reis","Anunciação — Alceu Valença","Black — Pearl Jam","Kiss Me — Sixpence None The Richer","Linger — The Cranberries","Lucky — Jason Mraz","Bubbly — Colbie Caillat","Si Antes Te Hubiera Conocido — KAROL G","Billie Jean — Michael Jackson","Iris — Goo Goo Dolls","Wherever You Will Go — The Calling","Ironic — Alanis Morissette","Boa Sorte — Vanessa da Mata","What's Up — 4 Non Blondes","Fogo — Capital Inicial","Behind Blue Eyes — Limp Bizkit","Metamorfose Ambulante — Raul Seixas","Times Like These — Foo Fighters","Sound Of Silence — Disturbed","I'm Yours — Jason Mraz"];let selected='';function render(){document.getElementById('songs').innerHTML=songs.map((s,i)=>`<button class="song" onclick="choose(${i})">🎵 ${s}</button>`).join('');renderQueue()}function choose(i){selected=songs[i];document.getElementById('selected').textContent=selected;document.getElementById('list').classList.add('hidden');document.getElementById('form').classList.remove('hidden')}function back(){document.getElementById('form').classList.add('hidden');document.getElementById('list').classList.remove('hidden')}function filter(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.song').forEach((b)=>b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none')}function send(){let n=document.getElementById('name').value.trim()||'Client';let t=document.getElementById('table').value.trim();let msg='🎤 NOUVELLE DEMANDE\n\n🎵 '+selected+'\n👤 Client : '+n+(t?'\n🍽️ Table : '+t:'');let q=JSON.parse(localStorage.getItem('karaokeQueue')||'[]');q.push({song:selected,name:n,table:t});localStorage.setItem('karaokeQueue',JSON.stringify(q));renderQueue();location.href='https://wa.me/33759377927?text='+encodeURIComponent(msg)}function addManual(){let v=document.getElementById('adminSong').value.trim();if(!v)return;let q=JSON.parse(localStorage.getItem('karaokeQueue')||'[]');q.push({song:v,name:'Manuel',table:''});localStorage.setItem('karaokeQueue',JSON.stringify(q));document.getElementById('adminSong').value='';renderQueue()}function renderQueue(){let q=JSON.parse(localStorage.getItem('karaokeQueue')||'[]');document.getElementById('queue').innerHTML=q.length?q.map((o,i)=>`<div class="order"><div>🎵 <b>${o.song}</b><br><small>👤 ${o.name}${o.table?' · 🍽️ '+o.table:''}</small></div><button class="done" onclick="finish(${i})">✓ Fait</button></div>`).join(''):'<div class="empty">Aucun morceau dans la file.</div>'}function finish(i){let q=JSON.parse(localStorage.getItem('karaokeQueue')||'[]');q.splice(i,1);localStorage.setItem('karaokeQueue',JSON.stringify(q));renderQueue()}render();</script></body></html>
